services:
  - type: web
    name: azhumathimayam-note-maker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/install_migan.py
    startCommand: gunicorn app:app -b 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

